version: "3.9"

services:
  mysql:
    image: mysql:8
    container_name: sensor_spring_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: modality
      MYSQL_USER: sensor
      MYSQL_PASSWORD: Sensor#Passw0rd!
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: sensor_spring_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.2.4
    container_name: sensor_spring_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  nginx:
    image: nginx:alpine
    container_name: sensor_spring_nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - rabbitmq

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
